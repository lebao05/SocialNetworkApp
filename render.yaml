services:
  - type: web
    name: socialnet-backend
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: SocialNet
      - key: Jwt__Audience
        value: socialnet_users
      - key: Jwt__ExpirationDurationInHour
        value: 168
      - key: Neo4j__Uri
        sync: false
      - key: Neo4j__Username
        sync: false
      - key: Neo4j__Password
        sync: false
      - key: Neo4j__Database
        sync: false
      - key: ClientUrl
        sync: false
      - key: Security__MessageEncryptionKey
        generateValue: true
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Port
        value: 587
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__Smtp__FromName
        value: SocialNet
      - key: Email__Smtp__FromAddress
        sync: false
      - key: Email__Smtp__UseSsl
        value: true
